<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist App - Auth & CRUD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* Auth Pages */
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            margin: 0 auto;
        }

        .auth-container h2 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .switch-auth a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-auth a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Todo App */
        .todo-app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-logout {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: white;
            color: #667eea;
        }

        .todo-content {
            padding: 30px;
        }

        .form-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-container h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .todo-form {
            display: grid;
            gap: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>

<!-- Login Page -->
<div id="login-page" class="container">
    <div class="auth-container">
        <h2>🔐 Login</h2>
        <div id="login-error" class="error-message hidden"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username atau Email</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="switch-auth">
            Belum punya akun? <a href="#" id="show-register">Daftar di sini</a>
        </div>
    </div>
</div>

<!-- Register Page -->
<div id="register-page" class="container hidden">
    <div class="auth-container">
        <h2>📝 Registrasi</h2>
        <div id="register-error" class="error-message hidden"></div>
        <div id="register-success" class="success-message hidden"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="register-username">Username (min 3 karakter)</label>
                <input type="text" id="register-username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
                <label for="register-password">Password (min 8 karakter, 1 huruf besar, 1 simbol)</label>
                <input type="password" id="register-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Daftar</button>
        </form>
        <div class="switch-auth">
            Sudah punya akun? <a href="#" id="show-login">Login di sini</a>
        </div>
    </div>
</div>

<!-- Todo App Page -->
<div id="todo-page" class="container hidden">
    <div class="todo-app">
        <div class="app-header">
            <h1>📝 My Todolist</h1>
            <div class="user-info">
                <span id="username-display"></span>
                <button class="btn-logout" id="logout-btn">Logout</button>
            </div>
        </div>

        <div class="todo-content">
            <!-- Form Create/Update -->
            <div class="form-container">
                <h3 id="form-title">➕ Tambah Todo Baru</h3>
                <form id="todo-form" class="todo-form">
                    <input type="hidden" id="todo-id">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="todo-judul">Judul</label>
                            <input type="text" id="todo-judul" required>
                        </div>
                        <div class="form-group">
                            <label for="todo-tanggal">Tanggal</label>
                            <input type="date" id="todo-tanggal" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="todo-isi">Deskripsi</label>
                        <textarea id="todo-isi" rows="3"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">
                            <span id="submit-text">Simpan</span>
                        </button>
                        <button type="button" class="btn-small btn-cancel hidden" id="cancel-btn">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <h3>📋 Daftar Todo</h3>
            <div class="table-container">
                <div id="loading" class="loading hidden">Loading...</div>
                <table id="todo-table" class="hidden">
                    <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th>Judul</th>
                        <th>Deskripsi</th>
                        <th style="width: 120px;">Tanggal</th>
                        <th style="width: 140px;">Aksi</th>
                    </tr>
                    </thead>
                    <tbody id="todo-tbody">
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state hidden">
                    <p>📭 Belum ada todo. Mulai tambahkan sekarang!</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8180';

    // Pages
    const loginPage = document.getElementById('login-page');
    const registerPage = document.getElementById('register-page');
    const todoPage = document.getElementById('todo-page');

    // Auth Elements
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginError = document.getElementById('login-error');
    const registerError = document.getElementById('register-error');
    const registerSuccess = document.getElementById('register-success');

    // Todo Elements
    const todoForm = document.getElementById('todo-form');
    const todoTable = document.getElementById('todo-table');
    const todoTbody = document.getElementById('todo-tbody');
    const emptyState = document.getElementById('empty-state');
    const loading = document.getElementById('loading');
    const usernameDisplay = document.getElementById('username-display');
    const logoutBtn = document.getElementById('logout-btn');
    const formTitle = document.getElementById('form-title');
    const submitText = document.getElementById('submit-text');
    const cancelBtn = document.getElementById('cancel-btn');

    // ============================================
    // AUTH FUNCTIONS
    // ============================================

    function getToken() {
        return localStorage.getItem('token');
    }

    function setToken(token) {
        localStorage.setItem('token', token);
    }

    function removeToken() {
        localStorage.removeItem('token');
    }

    function getUsername() {
        return localStorage.getItem('username');
    }

    function setUsername(username) {
        localStorage.setItem('username', username);
    }

    function showPage(page) {
        loginPage.classList.add('hidden');
        registerPage.classList.add('hidden');
        todoPage.classList.add('hidden');
        page.classList.remove('hidden');
    }

    function showError(element, message) {
        element.textContent = message;
        element.classList.remove('hidden');
        setTimeout(() => element.classList.add('hidden'), 5000);
    }

    function showSuccess(element, message) {
        element.textContent = message;
        element.classList.remove('hidden');
        setTimeout(() => element.classList.add('hidden'), 5000);
    }

    // Check if user is logged in
    function checkAuth() {
        const token = getToken();
        if (token) {
            usernameDisplay.textContent = `👤 ${getUsername()}`;
            showPage(todoPage);
            fetchTodos();
        } else {
            showPage(loginPage);
        }
    }

    // Login
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username_or_email: username,
                    password: password
                })
            });

            // Check if response has content
            const text = await response.text();
            let data;

            try {
                data = text ? JSON.parse(text) : {};
            } catch (e) {
                throw new Error('Server response tidak valid. Pastikan backend sedang berjalan.');
            }

            if (!response.ok) {
                throw new Error(data.error || `Error ${response.status}: ${response.statusText}`);
            }

            if (!data.token) {
                throw new Error('Token tidak ditemukan dalam response');
            }

            setToken(data.token);
            setUsername(username);
            loginForm.reset();
            checkAuth();

        } catch (error) {
            console.error('Login error:', error);
            showError(loginError, error.message);
        }
    });

    // Register
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('register-username').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        try {
            const response = await fetch(`${API_BASE}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            // Check if response has content
            const text = await response.text();
            let data;

            try {
                data = text ? JSON.parse(text) : {};
            } catch (e) {
                throw new Error('Server response tidak valid. Pastikan backend sedang berjalan.');
            }

            if (!response.ok) {
                throw new Error(data.error || `Error ${response.status}: ${response.statusText}`);
            }

            showSuccess(registerSuccess, 'Registrasi berhasil! Silakan login.');
            registerForm.reset();
            setTimeout(() => showPage(loginPage), 2000);

        } catch (error) {
            console.error('Register error:', error);
            showError(registerError, error.message);
        }
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
        if (confirm('Yakin ingin logout?')) {
            removeToken();
            localStorage.removeItem('username');
            showPage(loginPage);
        }
    });

    // Switch between login and register
    document.getElementById('show-register').addEventListener('click', (e) => {
        e.preventDefault();
        showPage(registerPage);
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
        e.preventDefault();
        showPage(loginPage);
    });

    // ============================================
    // TODO FUNCTIONS
    // ============================================

    async function fetchTodos() {
        loading.classList.remove('hidden');
        todoTable.classList.add('hidden');
        emptyState.classList.add('hidden');

        try {
            const response = await fetch(`${API_BASE}/todos`, {
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                }
            });

            if (response.status === 401) {
                removeToken();
                showPage(loginPage);
                return;
            }

            const text = await response.text();
            let todos;

            try {
                todos = text ? JSON.parse(text) : [];
            } catch (e) {
                throw new Error('Server response tidak valid');
            }

            if (!response.ok) throw new Error('Gagal mengambil data');

            loading.classList.add('hidden');

            if (todos.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            renderTodos(todos);

        } catch (error) {
            loading.classList.add('hidden');
            console.error('Fetch todos error:', error);
            alert('Error: ' + error.message);
        }
    }

    function renderTodos(todos) {
        todoTable.classList.remove('hidden');
        todoTbody.innerHTML = '';

        todos.forEach(todo => {
            // Handle tanggal yang mungkin dalam format berbeda
            const tanggal = todo.tanggal ? new Date(todo.tanggal).toLocaleDateString('id-ID') : '-';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${todo.id}</td>
                <td><strong>${todo.judul}</strong></td>
                <td>${todo.isi || '-'}</td>
                <td>${tanggal}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="editTodo(${todo.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteTodo(${todo.id})">Hapus</button>
                    </div>
                </td>
            `;
            todoTbody.appendChild(tr);
        });
    }

    // Create or Update Todo
    todoForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('todo-id').value;
        const judul = document.getElementById('todo-judul').value;
        const isi = document.getElementById('todo-isi').value;
        const tanggal = document.getElementById('todo-tanggal').value;

        const payload = { judul, isi, tanggal };

        try {
            const url = id ? `${API_BASE}/todos/${id}` : `${API_BASE}/todos`;
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getToken()}`
                },
                body: JSON.stringify(payload)
            });

            if (response.status === 401) {
                removeToken();
                showPage(loginPage);
                return;
            }

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Gagal menyimpan');
            }

            resetForm();
            fetchTodos();

        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // Edit Todo
    window.editTodo = async (id) => {
        try {
            const response = await fetch(`${API_BASE}/todos/${id}`, {
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                }
            });

            if (!response.ok) throw new Error('Gagal mengambil data');

            const todo = await response.json();

            document.getElementById('todo-id').value = todo.id;
            document.getElementById('todo-judul').value = todo.judul;
            document.getElementById('todo-isi').value = todo.isi;
            document.getElementById('todo-tanggal').value = todo.tanggal;

            formTitle.textContent = '✏️ Edit Todo';
            submitText.textContent = 'Update';
            cancelBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (error) {
            alert('Error: ' + error.message);
        }
    };

    // Delete Todo
    window.deleteTodo = async (id) => {
        if (!confirm('Yakin ingin menghapus todo ini?')) return;

        try {
            const response = await fetch(`${API_BASE}/todos/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${getToken()}`
                }
            });

            if (response.status === 401) {
                removeToken();
                showPage(loginPage);
                return;
            }

            if (!response.ok) throw new Error('Gagal menghapus');

            fetchTodos();

        } catch (error) {
            alert('Error: ' + error.message);
        }
    };

    // Reset Form
    function resetForm() {
        todoForm.reset();
        document.getElementById('todo-id').value = '';
        formTitle.textContent = '➕ Tambah Todo Baru';
        submitText.textContent = 'Simpan';
        cancelBtn.classList.add('hidden');
    }

    cancelBtn.addEventListener('click', resetForm);

    // Init
    checkAuth();
</script>

</body>
</html>
